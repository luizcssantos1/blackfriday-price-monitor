name: Monitor de geladeiras
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: price-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_discovery
      - run: python discovery.py
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name price-monitor
          git config user.email price-monitor@users.noreply.github.com
          git add prices.db
          if test -f candidates.json; then git add candidates.json; fi
          git diff --cached --quiet || (git commit -m 'Atualiza histórico de preços' && git push)
